name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tree-gate:
    name: Redundant main-run gate
    runs-on: ubuntu-latest
    outputs:
      redundant: ${{ steps.check.outputs.redundant }}

    # `checks: read` is NOT in the token's default read set for this endpoint —
    # the first real run 403'd with "Resource not accessible by integration".
    permissions:
      contents: read
      checks: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Every change lands as a squash-merge of a PR that CI already tested, so
      # the push-to-main run usually re-tests a tree with an existing green
      # verdict — ~30 minutes of runner time per merge for a foregone
      # conclusion. It is NOT always redundant though: a branch merged while
      # behind main produces a tree nobody tested, and git can textually
      # auto-merge into semantically broken code with no conflict markers. So
      # decide per push instead of blanket-skipping (or blanket-cancelling by
      # hand, which was the previous habit and only worked when a human
      # remembered).
      #
      # Skip only when BOTH hold:
      #   1. the pushed tree is byte-identical to the merged PR's head tree, and
      #   2. that head's own check runs were all green.
      # Identity alone is not enough — merging a red PR would otherwise skip the
      # run that would have caught it.
      #
      # FAIL-OPEN by construction: every unknown (no PR number, unreachable
      # ref, missing `gh`/`jq` on a self-hosted runner, unreadable check runs)
      # falls through to running the full suite. The worst case is the status
      # quo, never a silent gap in coverage.
      - name: Decide whether this push re-tests an already-green tree
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          run_everything() {
            echo "redundant=false" >> "$GITHUB_OUTPUT"
            echo "→ running the full suite: $1"
            exit 0
          }

          [ "${{ github.event_name }}" = "push" ] || run_everything "not a push to main"

          subject="$(git log -1 --pretty=%s)"
          pr="$(printf '%s\n' "$subject" | sed -n 's/.*(#\([0-9][0-9]*\))$/\1/p')"
          [ -n "$pr" ] || run_everything "no (#NNN) in \"$subject\" — treat as a direct push"

          git fetch --no-tags origin "refs/pull/$pr/head:refs/remotes/pr/$pr" \
            || run_everything "PR #$pr head is unreachable"

          pushed="$(git rev-parse 'HEAD^{tree}')"
          tested="$(git rev-parse "refs/remotes/pr/$pr^{tree}")" \
            || run_everything "cannot resolve PR #$pr head tree"
          [ "$pushed" = "$tested" ] \
            || run_everything "tree differs from PR #$pr head ($pushed vs $tested) — the squash produced code CI never saw"

          head_sha="$(git rev-parse "refs/remotes/pr/$pr")"
          # Capture BEFORE sorting. In a pipeline the assignment takes the exit
          # status of the LAST command (`sort`), so a failing `gh` sails past
          # the `||` and its JSON error body lands in $conclusions. That is
          # exactly what the first real run did: a 403 was reported as "checks
          # were not all green". Fail-open still ran the full suite, but a
          # misleading log is its own bug.
          raw="$(gh api "repos/${{ github.repository }}/commits/$head_sha/check-runs" \
            --paginate -q '.check_runs[] | select(.name != "Redundant main-run gate") | .conclusion' \
            2>/dev/null)" || run_everything "cannot read PR #$pr check runs (API error)"
          conclusions="$(printf '%s\n' "$raw" | sort -u)"
          [ -n "$conclusions" ] || run_everything "PR #$pr has no recorded check runs"
          [ "$conclusions" = "success" ] \
            || run_everything "PR #$pr checks were not all green ($(echo $conclusions | tr '\n' ' '))"

          echo "redundant=true" >> "$GITHUB_OUTPUT"
          echo "→ skipping: this tree is identical to PR #$pr head ($head_sha), which is fully green"

  lint:
    name: Lint (ESLint + Stylistic)
    runs-on: ubuntu-latest
    needs: [tree-gate]
    if: needs.tree-gate.outputs.redundant != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt eslint config
        run: npx nuxi prepare

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck (vue-tsc ratchet)
    runs-on: ubuntu-latest
    needs: [tree-gate]
    if: needs.tree-gate.outputs.redundant != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt types
        run: npx nuxi prepare

      # Regression gate, not a clean-tree gate: the repo carries a pre-existing
      # backlog recorded in typecheck-baseline.json, and this fails only when a
      # file gets worse. See scripts/typecheck-ratchet.mjs.
      - name: Run typecheck ratchet
        run: npm run typecheck:ci

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest
    needs: [tree-gate]
    if: needs.tree-gate.outputs.redundant != 'true'

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tripwire for the Vue split-brain class (2026-06-07): a second nested vue
      # copy in node_modules gets bundled twice by Nitro and 500s every SSR route
      # in production builds, while dev/E2E stay green (Vite dedupes). `npm ls vue`
      # exits non-zero on invalid trees; the find asserts no nested copies even
      # when the tree is technically valid.
      - name: Assert single Vue copy
        run: |
          npm ls vue
          dups=$(find node_modules -maxdepth 6 -path '*node_modules/vue/package.json' -not -path 'node_modules/vue/*')
          if [ -n "$dups" ]; then
            echo "Nested vue copies found (SSR split-brain risk):"
            echo "$dups"
            exit 1
          fi

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  codegen-check:
    name: OpenAPI codegen drift
    runs-on: ubuntu-latest
    needs: [tree-gate]
    if: needs.tree-gate.outputs.redundant != 'true'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="codegen-secret-not-for-prod--padding-x" \
            -e JWT_SECRET_KEY="codegen-jwt-secret-not-for-prod--pad-x" \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=codegen@example.com \
            -e EMAIL_FROM_NAME="Codegen" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            "$BACKEND_IMAGE"

      - name: Wait for backend /openapi.json
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/openapi.json" >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      - name: Check api.gen.ts is in sync
        run: bash scripts/check-openapi-types.sh

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload api.gen.ts diff (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: codegen-drift
          path: |
            shared/types/api.gen.ts
            backend.log
          if-no-files-found: ignore

  # Sharded 3 ways (2026-08-12). The suite is ~20 min serial and every new spec
  # taxes it, which was a standing disincentive to extend coverage at all.
  #
  # Sharding is deliberately NOT `fullyParallel: true`. In-process parallelism is
  # blocked by real shared state — the `store_config` singleton, the
  # one-country-one-zone shipping fixture, the shared DB — and unpicking that is
  # a large piece of work. Sharding sidesteps it entirely: each matrix entry is
  # its own runner VM, so it brings up its own Postgres service, its own backend
  # container and its own `ecommerce_e2e` database. Shards therefore cannot see
  # each other's state at all, and `workers: 1` still holds within a shard. That
  # also hardens against the store_config-leak class that burned #373/#374/#375.
  #
  # `fail-fast: false` so one shard failing still reports the other two — with
  # fail-fast a single flake would hide two thirds of the signal.
  #
  # Not mirrored into test.hive.yml: hive has only two frontend runner services
  # (hive-fe, hive-fe-aux) on one shared host, so a 3-way matrix would queue the
  # third shard behind the others and collide on host ports for no gain.
  e2e:
    name: E2E (Playwright + backend image) shard ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    needs: [tree-gate]
    if: needs.tree-gate.outputs.redundant != 'true'

    strategy:
      fail-fast: false
      matrix:
        # `stagger` is spelled out per shard rather than computed, because
        # GitHub Actions expressions have NO ARITHMETIC OPERATORS — the
        # documented set is ( ) [ ] . ! < <= > >= == != && || and nothing else.
        # An expression of the form "(matrix.shard - 1) * 30" is therefore NOT
        # valid: it fails the workflow at validation time, producing a run with
        # zero jobs and the unhelpful message "This run likely failed because
        # of a workflow file issue". Cost one run to learn (31545847806).
        include:
          - shard: 1
            stagger: 0
          - shard: 2
            stagger: 30
          - shard: 3
            stagger: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # GHCR repo names must be lowercase. `metadata-action` lowercases on publish,
      # so the image lives at ghcr.io/kasperone/... regardless of the GitHub
      # owner casing. Hardcoded here because ${{ github.repository_owner }}
      # preserves the original case and docker pull rejects it.
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      E2E_BACKEND_URL: http://localhost:8000
      E2E_DB_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_e2e
      # Must match the SECRET_KEY handed to the backend container below —
      # `e2e/admin/page-preview-token.spec.ts` signs CMS preview tokens locally
      # to reach the expired-token case (the mint route has no ttl knob). Not a
      # secret: it is a throwaway literal for the ephemeral e2e stack.
      E2E_SECRET_KEY: e2e-secret-not-for-prod--not-for-prod--padding
      NUXT_PUBLIC_API_BASE: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Shards 1/2/3 wait 0s/30s/60s. Without this the three shards plus
          # codegen-check all hit GHCR's token endpoint at once and stay in
          # lockstep through every retry; the first sharded run lost shard 3
          # that way, exhausting all 5 attempts and then failing every checkout
          # spec because no backend came up.
          stagger_seconds: ${{ matrix.stagger }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="e2e-secret-not-for-prod--not-for-prod--padding" \
            -e JWT_SECRET_KEY="e2e-jwt-secret-not-for-prod--not-for-prod--padding" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=2 \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=e2e@example.com \
            -e EMAIL_FROM_NAME="E2E" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            -e R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
            -e R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            -e R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -e R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}" \
            -e R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL }}" \
            "$BACKEND_IMAGE"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      # Provision the Playwright browsers from the official Microsoft image
      # (mcr.microsoft.com — a reliable registry) instead of `npx playwright
      # install`, whose CDN path hangs *after* the Chrome zip reaches 100% during
      # extraction / the next artifact. That stall was reproduced across runs
      # #156/#159/#160/#161/#162/#163 — force-kill + 3 retries bounded it but every
      # attempt re-hit the same post-download hang. The image ships the browsers
      # pre-extracted at /ms-playwright, so there's no download and no extraction.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Cache the seeded browsers so subsequent runs skip even the image pull.
      # restore/save split with save gated on success() + miss → a failed provision
      # never persists a partial browser dir. New key (`-mcr-`) so it doesn't reuse
      # any cache from the old CDN approach.
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-mcr-${{ steps.pw.outputs.version }}

      - name: Provision Playwright browsers from the Playwright image
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          IMG="mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble"
          echo "Pulling browsers from ${IMG}"
          docker pull "$IMG"
          cid=$(docker create "$IMG")
          mkdir -p "$HOME/.cache/ms-playwright"
          docker cp "$cid:/ms-playwright/." "$HOME/.cache/ms-playwright/"
          docker rm "$cid"
          sudo chown -R "$USER" "$HOME/.cache/ms-playwright"
          ls "$HOME/.cache/ms-playwright"

      # OS libs the browsers need (apt only — no browser download, so it can't hang).
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Save Playwright browser cache
        if: ${{ success() && steps.pw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-mcr-${{ steps.pw.outputs.version }}

      - name: Run Playwright
        env:
          # Un-skips e2e/admin/product-gallery.spec.ts (real-R2 upload path).
          # The R2_* secrets above give the backend container real dev-bucket
          # creds; keys are products/{id}/{uuid}.{ext} so CI runs can't collide
          # with dev objects.
          E2E_R2_ENABLED: "1"
        run: npm run e2e -- --shard=${{ matrix.shard }}/3

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          # Must be unique per matrix entry — upload-artifact v4+ rejects a
          # second upload under a name that already exists in the run.
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            playwright/.test-results/
            backend.log
          retention-days: 14
          if-no-files-found: ignore

  variant-sync:
    name: CI variant in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tripwire for ci-variant drift (2026-07-08): .github/workflows/test.yml is a
      # generated artifact — a byte-for-byte copy of one .github/ci-variants/test.<mode>.yml.
      # Editing test.yml directly without mirroring into the matching variant makes the
      # switch-ci-runner skill's drift guard abort at switch time (and forces a manual
      # reconciliation). This fails the FIRST drifting PR instead, so drift never
      # accumulates. Fix: edit ci-variants/test.<mode>.yml and copy it to test.yml
      # (or re-run the switch-ci-runner skill).
      - name: Assert test.yml matches a captured ci-variant
        run: |
          if diff -q .github/workflows/test.yml .github/ci-variants/test.ubuntu.yml >/dev/null 2>&1 \
             || diff -q .github/workflows/test.yml .github/ci-variants/test.hive.yml >/dev/null 2>&1; then
            echo "✓ test.yml is byte-identical to a captured ci-variant"
          else
            echo "::error file=.github/workflows/test.yml::test.yml matches NEITHER ci-variant — hand-edited without mirroring. Edit .github/ci-variants/test.<mode>.yml and copy it to test.yml (or re-run the switch-ci-runner skill). See switch-ci-runner SKILL.md > Handling drift."
            exit 1
          fi
