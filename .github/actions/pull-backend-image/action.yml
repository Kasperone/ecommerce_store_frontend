name: Pull backend image
description: >
  Authenticate to GHCR and pull a backend image with retry + linear backoff.
  Wraps both steps because GHCR's token endpoint is the actual flake source:
  when it stalls, both `docker login` and `docker pull` time out at the same
  layer.

inputs:
  image:
    description: Full image reference, e.g. ghcr.io/org/repo:tag.
    required: true
  username:
    description: GHCR username, typically github.actor.
    required: true
  github_token:
    description: Token with packages:read scope, typically secrets.GITHUB_TOKEN.
    required: true
  stagger_seconds:
    description: >
      Sleep before touching GHCR at all. Set this when several jobs in the same
      workflow run pull concurrently, so they do not all hit the token endpoint
      in the same instant. Defaults to 0 (no wait).
    required: false
    default: "0"

runs:
  using: composite
  steps:
    # Thundering-herd guard, added 2026-08-12 with the 3-way e2e shard.
    # Sharding took the number of concurrent GHCR pullers in one run from 2 to
    # 4 (codegen-check plus three shards), and on the very first sharded run
    # shard 3 exhausted all 5 login retries — ~150s of sustained throttling —
    # then failed every checkout spec for want of a backend. The retry loop
    # below is the right tool for a regional GHCR incident but the wrong one
    # for self-inflicted contention: all the retries are in lockstep, so they
    # collide again on every attempt. Offsetting the start breaks the lockstep.
    - name: Stagger GHCR access
      if: inputs.stagger_seconds != '0'
      shell: bash
      run: |
        echo "Waiting ${{ inputs.stagger_seconds }}s to de-synchronise concurrent GHCR pulls"
        sleep "${{ inputs.stagger_seconds }}"

    - name: GHCR login (with retry)
      shell: bash
      env:
        USERNAME: ${{ inputs.username }}
        TOKEN: ${{ inputs.github_token }}
      run: |
        # GHCR's token endpoint can stall during regional incidents (observed
        # 2026-05-19, runs #26089212322 and #26091110842 — both timed out
        # on Get https://ghcr.io/token?...). Retry with linear backoff before
        # declaring a hard failure. Worst case: ~6 min on sustained flake;
        # typical case: succeeds on first attempt in <2s.
        for attempt in 1 2 3 4 5; do
          if echo "$TOKEN" | docker login ghcr.io -u "$USERNAME" --password-stdin; then
            echo "::notice::GHCR login succeeded on attempt ${attempt}"
            exit 0
          fi
          if [ "$attempt" -lt 5 ]; then
            wait=$((attempt * 15))
            echo "GHCR login attempt ${attempt} failed; retrying in ${wait}s..."
            sleep "$wait"
          fi
        done
        echo "::error::GHCR login failed after 5 attempts (token endpoint unresponsive)"
        exit 1

    - name: Pull image (with retry)
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
      run: |
        # `docker pull` issues its own token request even after login, so it
        # hits the same flake surface. Same retry policy as login.
        for attempt in 1 2 3 4 5; do
          if docker pull "$IMAGE"; then
            echo "::notice::Pulled ${IMAGE} on attempt ${attempt}"
            exit 0
          fi
          if [ "$attempt" -lt 5 ]; then
            wait=$((attempt * 15))
            echo "Pull attempt ${attempt} failed; retrying in ${wait}s..."
            sleep "$wait"
          fi
        done
        echo "::error::Failed to pull ${IMAGE} after 5 attempts"
        exit 1
