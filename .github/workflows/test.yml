name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + Stylistic)
    # hive runs TWO frontend runners. `hive-aux` takes the jobs that touch
    # nothing shared — no Postgres, no docker, no host ports — so they run in
    # parallel with the DB-bound pair instead of queueing ahead of them.
    # `hive` stays reserved for codegen-check + e2e (see those jobs).
    # Rollback = point every job back at `[self-hosted, hive]`, or at
    # `ubuntu-latest` via the ubuntu ci-variant.
    runs-on: [self-hosted, hive-aux]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt eslint config
        run: npx nuxi prepare

      - name: Run ESLint
        run: npm run lint

  typecheck:
    name: Typecheck (vue-tsc ratchet)
    # DB-free — see lint job.
    runs-on: [self-hosted, hive-aux]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt types
        run: npx nuxi prepare

      # Regression gate, not a clean-tree gate: the repo carries a pre-existing
      # backlog recorded in typecheck-baseline.json, and this fails only when a
      # file gets worse. See scripts/typecheck-ratchet.mjs.
      - name: Run typecheck ratchet
        run: npm run typecheck:ci

  unit:
    name: Unit (Vitest)
    # DB-free — see lint job.
    runs-on: [self-hosted, hive-aux]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tripwire for the Vue split-brain class (2026-06-07): a second nested vue
      # copy in node_modules gets bundled twice by Nitro and 500s every SSR route
      # in production builds, while dev/E2E stay green (Vite dedupes). `npm ls vue`
      # exits non-zero on invalid trees; the find asserts no nested copies even
      # when the tree is technically valid.
      - name: Assert single Vue copy
        run: |
          npm ls vue
          dups=$(find node_modules -maxdepth 6 -path '*node_modules/vue/package.json' -not -path 'node_modules/vue/*')
          if [ -n "$dups" ]; then
            echo "Nested vue copies found (SSR split-brain risk):"
            echo "$dups"
            exit 1
          fi

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  codegen-check:
    name: OpenAPI codegen drift
    # Stays on `hive`, NOT `hive-aux`: this job and e2e both bind host port 5498
    # for Postgres, both run a container literally named `backend` on :8200, and
    # both drive the same `ecommerce_e2e` database — so they must never run
    # concurrently. One runner for the pair is what enforces that.
    # Self-hosted on hive (native — icc:false rules out a container job reaching
    # the backend; runs even while GitHub-hosted minutes are capped).
    runs-on: [self-hosted, hive]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          # Host port the native job reaches at localhost:5498. Distinct from the
          # backend repo's :5499 — both self-hosted runners share the hive host, so a
          # shared Postgres host port collides when backend + frontend CI overlap.
          - 5498:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      BACKEND_URL: http://localhost:8200

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker rm -f backend 2>/dev/null || true
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e PORT=8200 \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5498/ecommerce_e2e" \
            -e SECRET_KEY="codegen-secret-not-for-prod--padding-x" \
            -e JWT_SECRET_KEY="codegen-jwt-secret-not-for-prod--pad-x" \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=codegen@example.com \
            -e EMAIL_FROM_NAME="Codegen" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            "$BACKEND_IMAGE"

      - name: Wait for backend /openapi.json
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/openapi.json" >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      - name: Check api.gen.ts is in sync
        run: bash scripts/check-openapi-types.sh

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload api.gen.ts diff (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: codegen-drift
          path: |
            shared/types/api.gen.ts
            backend.log
          if-no-files-found: ignore

      - name: Stop backend container
        if: always()
        run: docker rm -f backend 2>/dev/null || true

  e2e:
    name: E2E (Playwright + backend image)
    # Stays on `hive` for the same reason as codegen-check: shared :5498,
    # the `backend` container name, and the `ecommerce_e2e` database.
    # Self-hosted on hive (native — icc:false; browsers copied out of the
    # version-matched Playwright image, OS libs pre-baked on the host and only
    # verified here — the runner user has no sudo; Nuxt dev server on :3100
    # since hive's :3000 is taken).
    # Serialize E2E across ALL refs (PRs + main) on the shared hive host so only
    # one E2E job runs at a time. Concurrent E2E runs starved the cold Nuxt dev
    # server (the root cause of the account-panel flake — failed ~every
    # post-merge run during a busy merge train) and collided on the :5498
    # Postgres host port. Fixed group (not ref-scoped) + cancel-in-progress:false
    # → a second E2E waits (pending), it is not cancelled.
    concurrency:
      group: frontend-e2e-hive
      cancel-in-progress: false
    runs-on: [self-hosted, hive]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          # Host port the native job reaches at localhost:5498. Distinct from the
          # backend repo's :5499 — both self-hosted runners share the hive host, so a
          # shared Postgres host port collides when backend + frontend CI overlap.
          - 5498:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # GHCR repo names must be lowercase. `metadata-action` lowercases on publish,
      # so the image lives at ghcr.io/kasperone/... regardless of the GitHub
      # owner casing. Hardcoded here because ${{ github.repository_owner }}
      # preserves the original case and docker pull rejects it.
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      E2E_BACKEND_URL: http://localhost:8200
      E2E_DB_URL: postgresql://postgres:postgres@localhost:5498/ecommerce_e2e
      NUXT_PUBLIC_API_BASE: http://localhost:8200
      # Nuxt dev-server port (playwright.config reads E2E_WEB_PORT); hive's :3000
      # is taken by another project's container.
      E2E_WEB_PORT: "3100"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker rm -f backend 2>/dev/null || true
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e PORT=8200 \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5498/ecommerce_e2e" \
            -e SECRET_KEY="e2e-secret-not-for-prod--not-for-prod--padding" \
            -e JWT_SECRET_KEY="e2e-jwt-secret-not-for-prod--not-for-prod--padding" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=2 \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=e2e@example.com \
            -e EMAIL_FROM_NAME="E2E" \
            -e FRONTEND_URL=http://localhost:3100 \
            -e CORS_ORIGINS='["http://localhost:3100"]' \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            -e R2_ACCOUNT_ID="${{ secrets.R2_ACCOUNT_ID }}" \
            -e R2_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY_ID }}" \
            -e R2_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -e R2_BUCKET_NAME="${{ secrets.R2_BUCKET_NAME }}" \
            -e R2_PUBLIC_URL="${{ secrets.R2_PUBLIC_URL }}" \
            "$BACKEND_IMAGE"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8200/health >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      # Provision the Playwright browsers from the official Microsoft image
      # (mcr.microsoft.com — a reliable registry) instead of `npx playwright
      # install`, whose CDN path hangs *after* the Chrome zip reaches 100% during
      # extraction / the next artifact. That stall was reproduced across runs
      # #156/#159/#160/#161/#162/#163 — force-kill + 3 retries bounded it but every
      # attempt re-hit the same post-download hang. The image ships the browsers
      # pre-extracted at /ms-playwright, so there's no download and no extraction.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Provision the browsers from the official Playwright image every run. On a
      # persistent self-hosted runner ~/.cache/ms-playwright survives between jobs,
      # but actions/cache is intentionally NOT used: its key is shared across all
      # Linux runners, so a stale cache saved by the old ubuntu jobs got restored
      # here MISSING chrome-headless-shell. A direct cp from the version-matched
      # mcr image is always complete (and avoids the CDN hang `npx playwright
      # install` hits — see git history).
      - name: Provision Playwright browsers from the Playwright image
        timeout-minutes: 10
        run: |
          set -euo pipefail
          IMG="mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble"
          echo "Pulling browsers from ${IMG}"
          docker pull "$IMG"
          cid=$(docker create "$IMG")
          mkdir -p "$HOME/.cache/ms-playwright"
          docker cp "$cid:/ms-playwright/." "$HOME/.cache/ms-playwright/"
          docker rm "$cid"
          ls "$HOME/.cache/ms-playwright"

      # The OS libs the browsers need are baked into the hive host. They can NOT
      # be installed from here: `playwright install-deps` shells out to `sudo
      # apt-get`, and the runner user has no sudo rights — deliberately, because
      # this runner executes PR code, so passwordless root here would be an RCE
      # primitive. (`docker cp` above already lands the cache owned by the runner
      # user, so the old `sudo chown` was redundant too.)
      #
      # Verify instead of install, so a genuinely missing lib fails HERE with a
      # readable message rather than as a cryptic browser-launch crash mid-suite.
      - name: Verify Playwright system deps
        run: |
          set -euo pipefail
          mapfile -t bins < <(find "$HOME/.cache/ms-playwright" -maxdepth 3 -type f \
            \( -name chrome -o -name chrome-headless-shell -o -name headless_shell \) -perm -u+x)
          if [ "${#bins[@]}" -eq 0 ]; then
            echo "::error::no chromium binaries found in the Playwright cache"
            exit 1
          fi
          missing=0
          for bin in "${bins[@]}"; do
            if ldd "$bin" | grep -q "not found"; then
              echo "::error::$bin is missing shared libraries:"
              ldd "$bin" | grep "not found"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Install them on the hive host as root (npx playwright install-deps chromium), then re-run."
            exit 1
          fi
          printf 'dependencies present for %d browser binaries\n' "${#bins[@]}"

      - name: Run Playwright
        env:
          # Un-skips e2e/admin/product-gallery.spec.ts (real-R2 upload path).
          # The R2_* secrets above give the backend container real dev-bucket
          # creds; keys are products/{id}/{uuid}.{ext} so CI runs can't collide
          # with dev objects.
          E2E_R2_ENABLED: "1"
        run: npm run e2e

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright/.test-results/
            backend.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Stop backend container
        if: always()
        run: docker rm -f backend 2>/dev/null || true

  variant-sync:
    name: CI variant in sync
    runs-on: [self-hosted, hive-aux]
    steps:
      - uses: actions/checkout@v5

      # Tripwire for ci-variant drift (2026-07-08): .github/workflows/test.yml is a
      # generated artifact — a byte-for-byte copy of one .github/ci-variants/test.<mode>.yml.
      # Editing test.yml directly without mirroring into the matching variant makes the
      # switch-ci-runner skill's drift guard abort at switch time (and forces a manual
      # reconciliation). This fails the FIRST drifting PR instead, so drift never
      # accumulates. Fix: edit ci-variants/test.<mode>.yml and copy it to test.yml
      # (or re-run the switch-ci-runner skill).
      - name: Assert test.yml matches a captured ci-variant
        run: |
          if diff -q .github/workflows/test.yml .github/ci-variants/test.ubuntu.yml >/dev/null 2>&1 \
             || diff -q .github/workflows/test.yml .github/ci-variants/test.hive.yml >/dev/null 2>&1; then
            echo "✓ test.yml is byte-identical to a captured ci-variant"
          else
            echo "::error file=.github/workflows/test.yml::test.yml matches NEITHER ci-variant — hand-edited without mirroring. Edit .github/ci-variants/test.<mode>.yml and copy it to test.yml (or re-run the switch-ci-runner skill). See switch-ci-runner SKILL.md > Handling drift."
            exit 1
          fi
