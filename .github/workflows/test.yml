name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  e2e:
    name: E2E (Playwright + backend image)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ecommerce_store_backend:main
      E2E_BACKEND_URL: http://localhost:8000
      E2E_DB_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_e2e
      NUXT_PUBLIC_API_BASE: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull backend image
        run: docker pull "$BACKEND_IMAGE"

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="e2e-secret-not-for-prod--not-for-prod--padding" \
            -e JWT_SECRET_KEY="e2e-jwt-secret-not-for-prod--not-for-prod--padding" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=2 \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=e2e@example.com \
            -e EMAIL_FROM_NAME="E2E" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            "$BACKEND_IMAGE"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run e2e

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright/.test-results/
            backend.log
          retention-days: 14
          if-no-files-found: ignore
