name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + Stylistic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt eslint config
        run: npx nuxi prepare

      - name: Run ESLint
        run: npm run lint

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tripwire for the Vue split-brain class (2026-06-07): a second nested vue
      # copy in node_modules gets bundled twice by Nitro and 500s every SSR route
      # in production builds, while dev/E2E stay green (Vite dedupes). `npm ls vue`
      # exits non-zero on invalid trees; the find asserts no nested copies even
      # when the tree is technically valid.
      - name: Assert single Vue copy
        run: |
          npm ls vue
          dups=$(find node_modules -maxdepth 6 -path '*node_modules/vue/package.json' -not -path 'node_modules/vue/*')
          if [ -n "$dups" ]; then
            echo "Nested vue copies found (SSR split-brain risk):"
            echo "$dups"
            exit 1
          fi

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  codegen-check:
    name: OpenAPI codegen drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="codegen-secret-not-for-prod--padding-x" \
            -e JWT_SECRET_KEY="codegen-jwt-secret-not-for-prod--pad-x" \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=codegen@example.com \
            -e EMAIL_FROM_NAME="Codegen" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            "$BACKEND_IMAGE"

      - name: Wait for backend /openapi.json
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/openapi.json" >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      - name: Check api.gen.ts is in sync
        run: bash scripts/check-openapi-types.sh

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload api.gen.ts diff (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: codegen-drift
          path: |
            shared/types/api.gen.ts
            backend.log
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + backend image)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # GHCR repo names must be lowercase. `metadata-action` lowercases on publish,
      # so the image lives at ghcr.io/kasperone/... regardless of the GitHub
      # owner casing. Hardcoded here because ${{ github.repository_owner }}
      # preserves the original case and docker pull rejects it.
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      E2E_BACKEND_URL: http://localhost:8000
      E2E_DB_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_e2e
      NUXT_PUBLIC_API_BASE: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="e2e-secret-not-for-prod--not-for-prod--padding" \
            -e JWT_SECRET_KEY="e2e-jwt-secret-not-for-prod--not-for-prod--padding" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=2 \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=e2e@example.com \
            -e EMAIL_FROM_NAME="E2E" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            -e E2E_DISABLE_RATE_LIMIT=true \
            "$BACKEND_IMAGE"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      # Provision the Playwright browsers from the official Microsoft image
      # (mcr.microsoft.com — a reliable registry) instead of `npx playwright
      # install`, whose CDN path hangs *after* the Chrome zip reaches 100% during
      # extraction / the next artifact. That stall was reproduced across runs
      # #156/#159/#160/#161/#162/#163 — force-kill + 3 retries bounded it but every
      # attempt re-hit the same post-download hang. The image ships the browsers
      # pre-extracted at /ms-playwright, so there's no download and no extraction.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      # Cache the seeded browsers so subsequent runs skip even the image pull.
      # restore/save split with save gated on success() + miss → a failed provision
      # never persists a partial browser dir. New key (`-mcr-`) so it doesn't reuse
      # any cache from the old CDN approach.
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-mcr-${{ steps.pw.outputs.version }}

      - name: Provision Playwright browsers from the Playwright image
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          IMG="mcr.microsoft.com/playwright:v${{ steps.pw.outputs.version }}-noble"
          echo "Pulling browsers from ${IMG}"
          docker pull "$IMG"
          cid=$(docker create "$IMG")
          mkdir -p "$HOME/.cache/ms-playwright"
          docker cp "$cid:/ms-playwright/." "$HOME/.cache/ms-playwright/"
          docker rm "$cid"
          sudo chown -R "$USER" "$HOME/.cache/ms-playwright"
          ls "$HOME/.cache/ms-playwright"

      # OS libs the browsers need (apt only — no browser download, so it can't hang).
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium

      - name: Save Playwright browser cache
        if: ${{ success() && steps.pw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-mcr-${{ steps.pw.outputs.version }}

      - name: Run Playwright
        run: npm run e2e

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright/.test-results/
            backend.log
          retention-days: 14
          if-no-files-found: ignore

  variant-sync:
    name: CI variant in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Tripwire for ci-variant drift (2026-07-08): .github/workflows/test.yml is a
      # generated artifact — a byte-for-byte copy of one .github/ci-variants/test.<mode>.yml.
      # Editing test.yml directly without mirroring into the matching variant makes the
      # switch-ci-runner skill's drift guard abort at switch time (and forces a manual
      # reconciliation). This fails the FIRST drifting PR instead, so drift never
      # accumulates. Fix: edit ci-variants/test.<mode>.yml and copy it to test.yml
      # (or re-run the switch-ci-runner skill).
      - name: Assert test.yml matches a captured ci-variant
        run: |
          if diff -q .github/workflows/test.yml .github/ci-variants/test.ubuntu.yml >/dev/null 2>&1 \
             || diff -q .github/workflows/test.yml .github/ci-variants/test.hive.yml >/dev/null 2>&1; then
            echo "✓ test.yml is byte-identical to a captured ci-variant"
          else
            echo "::error file=.github/workflows/test.yml::test.yml matches NEITHER ci-variant — hand-edited without mirroring. Edit .github/ci-variants/test.<mode>.yml and copy it to test.yml (or re-run the switch-ci-runner skill). See switch-ci-runner SKILL.md > Handling drift."
            exit 1
          fi
