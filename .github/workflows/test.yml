name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ESLint + Stylistic)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Nuxt eslint config
        run: npx nuxi prepare

      - name: Run ESLint
        run: npm run lint

  unit:
    name: Unit (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: warn

  codegen-check:
    name: OpenAPI codegen drift
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="codegen-secret-not-for-prod--padding-x" \
            -e JWT_SECRET_KEY="codegen-jwt-secret-not-for-prod--pad-x" \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=codegen@example.com \
            -e EMAIL_FROM_NAME="Codegen" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            "$BACKEND_IMAGE"

      - name: Wait for backend /openapi.json
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$BACKEND_URL/openapi.json" >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      - name: Check api.gen.ts is in sync
        run: bash scripts/check-openapi-types.sh

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload api.gen.ts diff (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: codegen-drift
          path: |
            shared/types/api.gen.ts
            backend.log
          if-no-files-found: ignore

  e2e:
    name: E2E (Playwright + backend image)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # GHCR repo names must be lowercase. `metadata-action` lowercases on publish,
      # so the image lives at ghcr.io/kasperone/... regardless of the GitHub
      # owner casing. Hardcoded here because ${{ github.repository_owner }}
      # preserves the original case and docker pull rejects it.
      BACKEND_IMAGE: ghcr.io/kasperone/ecommerce_store_backend:main
      E2E_BACKEND_URL: http://localhost:8000
      E2E_DB_URL: postgresql://postgres:postgres@localhost:5432/ecommerce_e2e
      NUXT_PUBLIC_API_BASE: http://localhost:8000

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull backend image
        uses: ./.github/actions/pull-backend-image
        with:
          image: ${{ env.BACKEND_IMAGE }}
          username: ${{ github.actor }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start backend container
        run: |
          docker run -d --name backend \
            --network host \
            -e ENVIRONMENT=development \
            -e DEBUG=False \
            -e DATABASE_URL="postgresql+psycopg2://postgres:postgres@localhost:5432/ecommerce_e2e" \
            -e SECRET_KEY="e2e-secret-not-for-prod--not-for-prod--padding" \
            -e JWT_SECRET_KEY="e2e-jwt-secret-not-for-prod--not-for-prod--padding" \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=2 \
            -e RESEND_API_KEY="" \
            -e EMAIL_FROM=e2e@example.com \
            -e EMAIL_FROM_NAME="E2E" \
            -e FRONTEND_URL=http://localhost:3000 \
            -e RATE_LIMIT_STORAGE_URL=memory:// \
            "$BACKEND_IMAGE"

      - name: Wait for backend /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health >/dev/null; then
              echo "backend ready after ${i} attempts"
              exit 0
            fi
            sleep 2
          done
          echo "backend never came up"
          docker logs backend || true
          exit 1

      # Browser binaries are cached (keyed on the Playwright version) so most runs
      # skip the ~170 MB Chromium download entirely. We split restore/save (rather
      # than the combined cache action) so a *failed* install never saves a partial
      # browser dir — otherwise the next run restores a broken browser and e2e fails.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      # On a cache miss, install with a per-attempt `timeout -k` (force-kill).
      # Playwright's downloader has no timeout and can stall *after* the zip hits
      # 100% (it then fetches the headless shell), so a hung attempt must be
      # SIGKILLed and retried — plain `timeout` only SIGTERMs and then waits, which
      # the hung npx ignores, so the job rides to the ceiling. Retries are cheap:
      # already-downloaded artifacts are skipped.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout -k 30 180 npx playwright install --with-deps chromium; then
              echo "Playwright install succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::Playwright install attempt ${attempt} hung or failed (force-killed); retrying in 15s"
            sleep 15
          done
          echo "::error::Playwright install failed after 3 attempts"
          exit 1

      # On a cache hit the browsers are restored, but the OS deps (apt) are not cached.
      - name: Install Playwright system deps (cache hit)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Save only on a cache miss AND only if the install above succeeded — never
      # cache a partial/broken browser dir (the explicit success() replaces the
      # implicit one that an `if:` would otherwise drop).
      - name: Save Playwright browser cache
        if: ${{ success() && steps.pw-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}

      - name: Run Playwright
        run: npm run e2e

      - name: Capture backend logs (on failure)
        if: failure()
        run: docker logs backend > backend.log 2>&1 || true

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report/
            playwright/.test-results/
            backend.log
          retention-days: 14
          if-no-files-found: ignore
